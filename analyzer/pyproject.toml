[project]
name = "analyzer"
version = "0.1.0"
description = "MASA Protocols Benchmarking Tool — result analyzer and visualizer"
readme = "README.md"
authors = [
    { name = "Marco Picone", email = "picone.m@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "rich>=15.0.0",
]

[project.scripts]
analyzer = "analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
